[project]
name = "rivalscope"
version = "0.1.0"
description = "Open-Source Multi-Agent Competitive Intelligence Platform for Fintech"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno==3.1.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "redis>=5.0.0",
    "fastmcp>=4.0.0",
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "croniter>=2.0.0",
    "python-dateutil>=2.9.0",
    "prometheus-client>=0.20.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-python-dateutil>=2.9.0",
    "types-redis>=4.6.0",
    "types-croniter>=2.0.0",
]
providers = [
    "tavily-python>=0.3.0",
    "slack-sdk>=3.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
