services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rivalscope-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rivalscope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rivalscope"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rivalscope-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: rivalmoves-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rivalscope-api
    restart: unless-stopped
    ports:
      - "7777:7777"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rivalscope
      ASYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rivalscope
      REDIS_URL: redis://redis:6379/0
      PORT: "7777"
      HOST: "0.0.0.0"
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7777/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: rivalmoves-worker:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rivalscope-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rivalscope
      ASYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rivalscope
      REDIS_URL: redis://redis:6379/0
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    image: rivalmoves-web:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rivalscope-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:7777
      BACKEND_INTERNAL_URL: http://api:7777
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
